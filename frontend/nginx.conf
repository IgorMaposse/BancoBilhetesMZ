server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy de todas as chamadas /api/* para o backend ticketing-platform
    # (o nome "ticketing-platform" resolve-se via a rede interna do docker-compose)
    location /api/ {
        proxy_pass http://ticketing-platform:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Angular: qualquer rota que nao seja um ficheiro estatico devolve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
